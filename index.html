<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Mobile web: fit device width, no pinch/double-tap zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Help Me! My Pet!">
    <meta name="theme-color" content="#FFF6E5">
    <title>Help Me! My Pet!</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #FFF6E5;
        overflow: hidden;
        /* Disable browser gestures (scroll, pull-to-refresh, double-tap zoom) so touches go to the game. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #unity-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FFF6E5;
      }

      /* Full viewport on a portrait phone. On wide (desktop/landscape) screens the script
         pillarboxes it to a 9:16 portrait column so the portrait-only UI stays usable. */
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #FFF6E5;
        touch-action: none;
        outline: none;
      }

      #unity-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #FFF6E5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: #5A4632;
        text-align: center;
        z-index: 10;
        transition: opacity 0.3s ease;
      }

      #unity-loading-title {
        font-size: clamp(26px, 8vw, 40px);
        font-weight: 800;
        letter-spacing: 0.5px;
        margin: 0 24px 28px;
      }

      #unity-loading-track {
        width: min(70vw, 360px);
        height: 14px;
        border-radius: 7px;
        background: #F0E2C6;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      #unity-loading-fill {
        width: 0%;
        height: 100%;
        border-radius: 7px;
        background: #2BB3A3;
        transition: width 0.15s linear;
      }

      #unity-loading-status {
        margin-top: 12px;
        font-size: 14px;
        opacity: 0.75;
        min-height: 1.4em;
        padding: 0 24px;
      }

      /* Portrait-only game: ask phone users to rotate back. */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #FFF6E5;
        color: #5A4632;
        font: 600 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="unity-stage">
      <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
    </div>

    <div id="unity-loading">
      <div id="unity-loading-title">Help Me! My Pet!</div>
      <div id="unity-loading-track"><div id="unity-loading-fill"></div></div>
      <div id="unity-loading-status">Loading…</div>
    </div>

    <div id="rotate-hint">Please rotate your phone to portrait.</div>

    <script src="Build/WebGL.loader.js?v=33aff79"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var loadingFill = document.querySelector("#unity-loading-fill");
      var loadingStatus = document.querySelector("#unity-loading-status");

      // Widest allowed aspect (w/h). Phones in portrait are narrower -> full viewport.
      var MAX_ASPECT = 9 / 16;

      function fitCanvas() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (w / h > MAX_ASPECT) {
          canvas.style.width = Math.round(h * MAX_ASPECT) + "px";
          canvas.style.height = h + "px";
        } else {
          canvas.style.width = "100%";
          canvas.style.height = "100%";
        }
      }

      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 150); });

      // Block browser zoom / context menu; keep taps and drags for the game.
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb?v=33aff79",
        frameworkUrl: "Build/WebGL.framework.js.unityweb?v=33aff79",
        codeUrl: "Build/WebGL.wasm.unityweb?v=33aff79",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "rnmsoft",
        productName: "Help Me! My Pet!",
        productVersion: "1.0.0",
        // Cap render resolution: high-DPR phones (3x) would otherwise render ~2.25x the pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        // No "mobile not supported" banner: warnings go to the console only.
        showBanner: function (msg, type) {
          if (type === "error") { console.error(msg); } else { console.warn(msg); }
        },
      }, function (progress) {
        var pct = Math.round(progress * 100);
        loadingFill.style.width = pct + "%";
        loadingStatus.textContent = pct < 90 ? "Loading… " + pct + "%" : "Starting…";
      }).then(function (instance) {
        window.unityInstance = instance;
        loading.style.opacity = "0";
        setTimeout(function () { loading.style.display = "none"; }, 300);
        fitCanvas();
      }).catch(function (message) {
        loadingStatus.textContent = String(message);
        console.error(message);
      });
    </script>
  </body>
</html>
