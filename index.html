    <link rel="icon" type="image/png" sizes="16x16" href="loader/favicon-16.png?a=7731ee7012">

    <link rel="manifest" href="loader/manifest.webmanifest?a=7731ee7012">
    <!--
      HTML loader = a copy of the game's own loading screen (Loading Graphics.prefab, 1080x1920
      reference, CanvasScaler matched to width) so the hand-over to Unity is invisible:
      same background (aspect-fill), same title logo rect, same "Loading.." text + fill bar.
      Assets in loader/ are exported by tools/make_loader_assets.py; redeploy.sh replaces the
      ?a= token with a hash of loader/ (cache-bust separate from the four Build/WebGL.* refs).
    -->
    <link rel="preload" as="image" href="loader/bg.webp?a=7731ee7012" fetchpriority="high">
    <link rel="preload" as="font" type="font/woff2" href="loader/fredoka.woff2?a=7731ee7012" crossorigin>
    <script>
      // Same language rule as the game's first start (system language): ko* -> Korean, else English.
      // (The game also remembers a language picked in Settings in PlayerPrefs; JS can't read that.)
      (function () {
        var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
        var ko = /^ko\b/i.test(String(langs[0] || ""));
        window.__loaderLang = ko ? "ko" : "en";
        document.documentElement.lang = window.__loaderLang;
        function preload(href, as, type) {
          var l = document.createElement("link");
          l.rel = "preload"; l.as = as; l.href = href;
          if (type) { l.type = type; l.crossOrigin = "anonymous"; }
          if (as === "image") { l.setAttribute("fetchpriority", "high"); }
          document.head.appendChild(l);
        }
        preload("loader/logo_" + window.__loaderLang + ".webp?a=7731ee7012", "image");
        if (ko) { preload("loader/jua.woff2?a=7731ee7012", "font", "font/woff2"); }
      })();
    </script>
    <style>
      @font-face {
        font-family: "LoaderFredoka";
        src: url("loader/fredoka.woff2?a=7731ee7012") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "LoaderJua";
        src: url("loader/jua.woff2?a=7731ee7012") format("woff2");
        font-display: block;
      }

      :root {
        /* Average sky colour of loading_bg (make_loader_assets.py) — painted before any image arrives. */
        --sky: #53d7fd;
        /* 1 reference unit of the game's 1080x1920 canvas (match width). JS keeps it exact. */
        --u: calc(min(100vw, 56.25vh) / 1080);
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--sky);
        overflow: hidden;
        /* Disable browser gestures (scroll, pull-to-refresh, double-tap zoom) so touches go to the game. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #unity-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--sky);
      }

      /* Full viewport on a portrait phone. On wide (desktop/landscape) screens the script
         pillarboxes it to a 9:16 portrait column so the portrait-only UI stays usable. */
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        touch-action: none;
        outline: none;
      }

      /* ---- loader (mirror of the in-game loading screen) ---- */
      #unity-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--sky);
        z-index: 10;
        opacity: 1;
        transition: opacity 0.25s ease-out;
      }
      #unity-loading.fade { opacity: 0; pointer-events: none; }

      /* Same rect as the canvas (fitCanvas sizes both). */
      #loader-frame {
        position: relative;
        flex: none;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Background image: aspect-fill + centred = the game's AspectRatioFitter.EnvelopeParent.

          url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAAgABIDASIAAhEBAxEB/8QAGQAAAgMBAAAAAAAAAAAAAAAAAAMBAgQG/8QAKBAAAgIBAwMCBwEAAAAAAAAAAQIDEQAEEiEFMVETkRQiM2Gh0eHw/8QAGAEAAgMAAAAAAAAAAAAAAAAABAYCAwX/xAAkEQABAgQFBQAAAAAAAAAAAAABAAQCAxESExQVUaEiQVKR0f/aAAwDAQACEQMRAD8A6uUyahg0zb2Aq6HbKeiL5F5sqBkDrKu0ixfc19sorIGuQAID3u/cD/DNYPJNtREKJRybiMk2lR8RGOB0/TUPK3hiH6x09XYGCSwSPpN+sMA1Zt4xeijMm63HHxa3jXSaZJH3S+mPmPgXf8xEkGoZ7jKoGB5I4HIPH59sdptZDMhEZUBeKBsZMk6gMSRxycAwoD1dk1C22gCWY2vlFY+d3fDMh1um3G9bADfbxhkMZtvwVTWWv//Z") center / cover no-repeat,

        position: absolute;
        left: 6%;
        top: 2.5%;
        width: 88%;
        height: 26%;
        object-fit: contain;
        object-position: center;
        -webkit-user-drag: none;
      }

      /* TMP text look: white face + black outline (stroke layer drawn behind the face). */
      .outlined {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: "LoaderFredoka", "LoaderJua", "Arial Rounded MT Bold", sans-serif;
        white-space: nowrap;
        line-height: 1;
        isolation: isolate;
      }
      .outlined::before {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        -webkit-text-stroke: var(--stroke) #000;
        z-index: -1;
      }

      /* Loading Text: bottom-stretched, y=170, h=100, size 62, UpperCase, middle-centre. */
      #loader-text {
        bottom: calc(170 * var(--u));
        height: calc(100 * var(--u));
        font-size: calc(62 * var(--u));
        text-transform: uppercase;
        --stroke: calc(62 * var(--u) * 0.2);
      }

      /* Fillbar: centred, y=90, 365x100; track (core_universal_back, tint #3C3C3C) 51.7 high,
         fill (fill_bar_front, 9-sliced, clipped by a horizontal Filled mask) 49.8 high. */
      #loader-bar {
        position: absolute;
        left: 50%;
        bottom: calc(90 * var(--u));
        width: calc(365 * var(--u));
        height: calc(100 * var(--u));
        transform: translateX(-50%);

      #loader-track {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: calc(51.7 * var(--u));
        transform: translateY(-50%);
        border-radius: calc(25.85 * var(--u));
        background: #3c3c3c;
      }
      #loader-fill {
        --k: calc(49.8 * var(--u) / 802);  /* Unity shrinks the 397+405 px slices to fit 49.8 */
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: calc(49.8 * var(--u));
        transform: translateY(-50%);
        box-sizing: border-box;
        border-style: solid;
        border-width: calc(397 * var(--k)) calc(347 * var(--k)) calc(405 * var(--k)) calc(347 * var(--k));
        border-image: url("loader/bar_fill.png?a=7731ee7012") 99.25 86.75 101.25 86.75 fill / 1 / 0 stretch;
        clip-path: inset(0 100% 0 0);

        top: 50%;
        height: calc(45 * var(--u));

        position: absolute;
        left: 16px;
        right: 16px;
        bottom: calc(20 * var(--u));
        margin: 0;
        color: #fff;
        font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        text-shadow: 0 1px 2px #000;
        white-space: pre-wrap;
      }
      #unity-loading-status:empty { display: none; }

      /* Small toast (save reset confirmation). */
      #loader-toast {
        position: absolute;
        left: 50%;
        top: 34%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font: 600 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease-out;
        pointer-events: none;
      }
      #loader-toast.show { opacity: 1; }

      /* Portrait-only game: ask phone users to rotate back. */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--sky);
        color: #fff;
        font: 600 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) {
        #rotate-hint { display: flex; }
      }

        return a === b ? [a] : [a, b];
      }
      // Resolves {ok, deleted:[keys]}; gives up after 2 s (iOS: blocked/hanging IndexedDB, private mode).
      function wipeSaveData() {
        return new Promise(function (resolve) {
          var done = false;
          function finish(r) { if (!done) { done = true; resolve(r); } }
          setTimeout(function () { finish({ ok: false, why: "timeout", deleted: [] }); }, 2000);
          try {
            if (!window.indexedDB) { finish({ ok: true, why: "no indexedDB", deleted: [] }); return; }
            var folders = idbfsFolders();
            var req = indexedDB.open("/idbfs");
            req.onupgradeneeded = function () {
              // DB didn't exist (nothing saved yet): don't create it.
              try { req.transaction.abort(); } catch (e) { /* ignore */ }
              finish({ ok: true, why: "no save db", deleted: [] });
            };
            req.onblocked = function () { /* another tab upgrading; the 2 s timeout covers it */ };
            req.onerror = function () { finish({ ok: false, why: "open error", deleted: [] }); };
            req.onsuccess = function () {
              var db = req.result;
              if (!db.objectStoreNames.contains("FILE_DATA")) { db.close(); finish({ ok: true, why: "empty", deleted: [] }); return; }
              var tx = db.transaction("FILE_DATA", "readwrite");
              var store = tx.objectStore("FILE_DATA");
              var deleted = [];
              var cur = store.openKeyCursor ? store.openKeyCursor() : store.openCursor();
              cur.onsuccess = function () {
                var c = cur.result;
                if (!c) { return; }
                var k = String(c.key);
                for (var i = 0; i < folders.length; i++) {
                  if (k === folders[i] || k.indexOf(folders[i] + "/") === 0) { store.delete(c.key); deleted.push(k); break; }
                }
                c.continue();
              };
              tx.oncomplete = function () { db.close(); finish({ ok: true, why: "done", deleted: deleted }); };
              tx.onerror = tx.onabort = function () { db.close(); finish({ ok: false, why: "tx error", deleted: [] }); };
            };
          } catch (e) {
            finish({ ok: false, why: String(e && e.message || e), deleted: [] });
          }
        });
      }
      function showToast(text) {
        var t = document.getElementById("loader-toast");
        t.textContent = text;
        t.classList.add("show");
        setTimeout(function () { t.classList.remove("show"); }, 3500);
      }
      function maybeResetSaveData() {
        if (!resetRequested()) { return Promise.resolve(null); }
        stripResetParam();   // first: a refresh during/after the reset must not wipe again
        var ls = wipeLocalStorageSave();
        return wipeSaveData().then(function (r) {
          r.localStorage = ls;
          window.__saveReset = r;
          var ko = window.__loaderLang === "ko";
          showToast(r.ok ? (ko ? "저장 데이터를 초기화했어요" : "Save data reset")
                         : (ko ? "저장 데이터를 초기화하지 못했어요" : "Couldn't reset save data"));
          console.log("[save reset]", JSON.stringify(r));
        });
      }

      // Typing "#reset" onto the already-open page is a same-document navigation (no reload):
      // reload so the wipe runs before Unity starts.
      window.addEventListener("hashchange", function () {
        if (/^#reset$/i.test(location.hash)) { location.reload(); }
      });

      maybeResetSaveData().then(function () {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/WebGL.data.unityweb?v=c8f8233",
          frameworkUrl: "Build/WebGL.framework.js.unityweb?v=c8f8233",
          codeUrl: "Build/WebGL.wasm.unityweb?v=c8f8233",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "rnmsoft",
          productName: "Help Me! My Pet!",
          productVersion: "1.0.0",
          // Cap render resolution: high-DPR phones (3x) would otherwise render ~2.25x the pixels.
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          // No "mobile not supported" banner: warnings go to the console only.
          showBanner: function (msg, type) {
            if (type === "error") { console.error(msg); } else { console.warn(msg); }
          },
        }, function (progress) {
          // Unity reports 0-0.9 while downloading and 1.0 once started; we show at most 90 %.
          setProgress(progress * 100);
        }).then(function (instance) {
          window.unityInstance = instance;
          fitCanvas();
          setProgress(90);
          waitForFirstGameFrame();
        }).catch(function (message) {
          loadingStatus.textContent = String(message);
          console.error(message);
        });
      });
    </script>
